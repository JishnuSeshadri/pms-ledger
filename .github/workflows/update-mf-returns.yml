name: Update MF returns

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 03:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch NAV data and compute returns
        run: node scripts/update-mf-returns.mjs

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "mf-returns-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/mf-returns.json scripts/mf-scheme-map.json scripts/mf-scheme-map-needs-review.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: refresh MF returns [automated]"
          git push
